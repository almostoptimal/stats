   <g id="text_12">
    <text style="fill: #222222; font: 9px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="517.8816" y="173.091156" transform="rotate(-0 517.8816 173.091156)">D2：报告它多好</text>
