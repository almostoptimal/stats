   <g id="text_6">
    <text style="fill: #222222; font: 9.4px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="158.0832" y="110.332352" transform="rotate(-0 158.0832 110.332352)">一批数据 D</text>
   </g>
   <g id="text_7">
    <text style="fill: #222222; font: 9.4px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="158.0832" y="173.201312" transform="rotate(-0 158.0832 173.201312)">在 D 里选出最好的那个</text>
   </g>
   <g id="text_8">
    <text style="fill: #222222; font: 9.4px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="158.0832" y="236.070272" transform="rotate(-0 158.0832 236.070272)">用 D 报告它有多好</text>
