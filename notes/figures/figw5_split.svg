   </g>
   <g id="text_10">
    <text style="fill: #222222; font: 9.4px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="436.6368" y="110.332352" transform="rotate(-0 436.6368 110.332352)">数据 D 拆成 D1 和 D2</text>
   </g>
   <g id="text_11">
    <text style="fill: #222222; font: 9px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="355.392" y="173.091156" transform="rotate(-0 355.392 173.091156)">D1：选出最好的</text>
