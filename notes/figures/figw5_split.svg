   <g id="text_13">
    <text style="fill: #222222; font: 9.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="436.6368" y="236.015194" transform="rotate(-0 436.6368 236.015194)">两边用的是不同的噪声</text>
   </g>
   <g id="text_14">
    <text style="fill: #222222; font: 9.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(409.0368 299.315592)">报告值是对的</text>
