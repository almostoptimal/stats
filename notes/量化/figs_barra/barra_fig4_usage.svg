<svg viewBox="0 0 680 322" width="680" height="322" xmlns="http://www.w3.org/2000/svg">
<title>Barra 模型的四类实践用法</title>
<desc>风险预测、组合优化、业绩归因、中性化提纯四类用法及其核心公式与执行要点。</desc>
<rect x="0" y="0" width="680" height="322" fill="#FFFFFF"/>
<rect x="40" y="44" width="294" height="122" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="70" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">风险预测（事前）</text>
<text x="60" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">σ_p = √(wᵀVw)，w 取主动权重得 TE</text>
<text x="60" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">MCTR_i = (Vw)_i / σ_p，Σ CCTR = σ_p</text>
<text x="60" y="144" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">可拆成因子风险与特异风险</text>
<rect x="350" y="44" width="290" height="122" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="370" y="70" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">组合优化</text>
<text x="370" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">min wᵀVw − λ αᵀw + 交易成本</text>
<text x="370" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">s.t. 行业中性 · 暴露上限 · 换手</text>
<text x="370" y="144" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">二次型降到 K 维，求解快且稳</text>
<rect x="40" y="180" width="294" height="122" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="206" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">业绩归因</text>
<text x="60" y="232" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">把组合当成一只股票跑同一套回归</text>
<text x="60" y="256" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">r_p = Σ_k X_pk f_k + u_p</text>
<text x="60" y="280" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">区分风格漂移与真实选股能力</text>
<rect x="350" y="180" width="290" height="122" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="370" y="206" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">中性化与 alpha 提纯</text>
<text x="370" y="232" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">对因子回归取残差，得纯 alpha</text>
<text x="370" y="256" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">暴露限额：|X_p,k| ≤ 0.5σ</text>
<text x="370" y="280" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">用 F 算因子层 VaR 与压力测试</text>
</svg>
