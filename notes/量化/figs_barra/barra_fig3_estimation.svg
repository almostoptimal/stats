<svg viewBox="0 0 680 320" width="680" height="320" xmlns="http://www.w3.org/2000/svg">
<title>Barra 风险模型的两阶段估计流程</title>
<desc>阶段 A 对每个时点做平方根市值加权的截面回归得到因子收益与残差，阶段 B 在时序上对因子收益和残差估计协方差并组装成 V。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>
<rect x="40" y="44" width="290" height="256" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="62" y="72" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">阶段 A · 截面回归</text>
<text x="62" y="92" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">每个 t 独立做一次</text>
<path d="M62 104 L308 104" fill="none" stroke="#85B7EB" stroke-width="0.5"/>
<circle cx="70" cy="128" r="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="70" y="128" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">1</text>
<text x="86" y="128" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">原始 descriptor</text>
<circle cx="70" cy="156" r="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="70" y="156" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">2</text>
<text x="86" y="156" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">去极值 · 补缺失 · z-score</text>
<circle cx="70" cy="184" r="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="70" y="184" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">3</text>
<text x="86" y="184" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">加权合成风格因子</text>
<circle cx="70" cy="212" r="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="70" y="212" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">4</text>
<text x="86" y="212" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">行业哑变量市值纯化</text>
<circle cx="70" cy="240" r="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="70" y="240" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">5</text>
<text x="86" y="240" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">WLS：权重 ∝ 市值平方根</text>
<circle cx="70" cy="268" r="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="70" y="268" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">6</text>
<text x="86" y="268" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">输出 f_t (K×1) 与 u_t (N×1)</text>
<path d="M336 172 L372 172" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="354" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5F5E5A">T 期</text>
<rect x="380" y="44" width="260" height="256" rx="16" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="400" y="72" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">阶段 B · 时序估计</text>
<text x="400" y="92" font-family="system-ui,sans-serif" font-size="12" fill="#854F0B">跨期汇总成协方差</text>
<path d="M400 104 L620 104" fill="none" stroke="#EF9F27" stroke-width="0.5"/>
<circle cx="408" cy="128" r="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="408" y="128" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#633806">1</text>
<text x="424" y="128" font-family="system-ui,sans-serif" font-size="12" fill="#633806">f_t → EWMA + HAC → F</text>
<circle cx="408" cy="160" r="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="408" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#633806">2</text>
<text x="424" y="160" font-family="system-ui,sans-serif" font-size="12" fill="#633806">u_t → EWMA + 收缩 → Δ</text>
<circle cx="408" cy="192" r="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="408" y="192" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#633806">3</text>
<text x="424" y="192" font-family="system-ui,sans-serif" font-size="12" fill="#633806">VRA 波动区制校准</text>
<circle cx="408" cy="224" r="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="408" y="224" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#633806">4</text>
<text x="424" y="224" font-family="system-ui,sans-serif" font-size="12" fill="#633806">组装 V = XFXᵀ + Δ</text>
<circle cx="408" cy="256" r="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="408" y="256" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#633806">5</text>
<text x="424" y="256" font-family="system-ui,sans-serif" font-size="12" fill="#633806">bias 检验：Z 值是否偏离</text>
</svg>
