<svg viewBox="0 0 680 320" width="680" height="320" xmlns="http://www.w3.org/2000/svg">
<title>样本协方差与结构化风险模型的参数量对比</title>
<desc>左侧 N 乘 N 稠密样本协方差需要估计约 450 万个参数且秩亏，右侧 V 等于 X F X 转置加 Delta 的因子结构只需约 4275 个参数。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <pattern id="gridR" width="15" height="15" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="12" height="12" rx="1" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
  </pattern>
</defs>
<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>
<rect x="40" y="44" width="285" height="256" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="60" y="74" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#791F1F">样本协方差 Σ̂</text>
<text x="60" y="94" font-family="system-ui,sans-serif" font-size="12" fill="#A32D2D">用历史收益直接估计</text>
<rect x="60" y="112" width="117" height="117" fill="url(#gridR)"/>
<text x="182" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#791F1F">待估 4,501,500 个</text>
<text x="182" y="274" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A32D2D">N=3000, T=250 天 → 秩亏</text>
<path d="M330 172 L350 172" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5F5E5A">降维</text>
<rect x="355" y="44" width="285" height="256" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="375" y="74" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">结构化模型 V = XFXᵀ + Δ</text>
<text x="375" y="94" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">把 N 维问题压到 K 维</text>
<rect x="375" y="118" width="22" height="104" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="407" y="152" width="34" height="34" rx="3" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="451" y="152" width="104" height="34" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="173" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#0F6E56">+</text>
<rect x="584" y="118" width="42" height="104" rx="3" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<path d="M584 118 L626 222" fill="none" stroke="#0F6E56" stroke-width="0.5"/>
<text x="470" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">X F Xᵀ</text>
<text x="605" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">Δ</text>
<text x="497" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">待估 4,275 个</text>
<text x="497" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">N=3000, K=50 → 可估</text>
</svg>
