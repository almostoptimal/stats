<svg viewBox="0 0 680 320" width="680" height="320" xmlns="http://www.w3.org/2000/svg">
<title>CNE6 因子体系的三类因子构成</title>
<desc>1 个市场因子、32 个行业因子、16 个风格因子（CNE6 长期模型），风格因子由底层 descriptor 加权合成。</desc>
<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>
<rect x="40" y="44" width="130" height="256" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="58" y="74" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">市场因子</text>
<text x="58" y="94" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">1 个</text>
<path d="M58 108 L152 108" fill="none" stroke="#85B7EB" stroke-width="0.5"/>
<text x="58" y="136" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">暴露恒为 1</text>
<text x="58" y="166" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">全市场共同运动</text>
<text x="58" y="196" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">即回归截距项</text>
<text x="58" y="226" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">Barra 称 Market</text>
<text x="58" y="256" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">不可分散</text>
<rect x="182" y="44" width="168" height="256" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="198" y="74" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">行业因子</text>
<text x="198" y="94" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">CNE5 / CNE6：32 个</text>
<path d="M198 108 L334 108" fill="none" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="198" y="136" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">0 / 1 哑变量</text>
<text x="198" y="166" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">与市因子完全共线</text>
<text x="198" y="196" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">须做市值纯化</text>
<text x="198" y="226" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">收益市值加权和 0</text>
<text x="198" y="256" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">CNE6 拆分化工</text>
<rect x="362" y="44" width="278" height="256" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="378" y="74" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#633806">风格因子 Style</text>
<text x="378" y="94" font-family="system-ui,sans-serif" font-size="12" fill="#854F0B">CNE5 有 10 个 → CNE6 有 16 个</text>
<rect x="378" y="108" width="246" height="144" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
<text x="392" y="130" font-family="system-ui,sans-serif" font-size="12" fill="#633806">Size ← LNCAP</text>
<text x="392" y="152" font-family="system-ui,sans-serif" font-size="12" fill="#633806">Value ← BTOP · ETOP</text>
<text x="392" y="174" font-family="system-ui,sans-serif" font-size="12" fill="#633806">Momentum ← RSTR</text>
<text x="392" y="196" font-family="system-ui,sans-serif" font-size="12" fill="#633806">ResVol ← DASTD · CMRA · HSIGMA</text>
<text x="392" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#633806">Liquidity ← STOM · STOQ · STOA</text>
<text x="392" y="240" font-family="system-ui,sans-serif" font-size="12" fill="#633806">Leverage ← MLEV · DTOA · BLEV</text>
<text x="378" y="278" font-family="system-ui,sans-serif" font-size="12" fill="#854F0B">Growth · Earnings Yield · Quality · MidCap</text>
</svg>
