<svg viewBox="0 0 680 352" width="680" height="352" xmlns="http://www.w3.org/2000/svg">
<title>Barra 的三类因子</title>
<desc>市场因子一个、行业因子三十二个、风格因子十个，合计约四十三个因子暴露列。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="352" fill="#FFFFFF"/>
<text x="30.0" y="30.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start">因子有哪些：一个市场 + 三十二个行业 + 十个风格</text>
<rect x="30.0" y="48.0" width="190.0" height="190.0" rx="12.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="48.0" y="74.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#0C447C" text-anchor="start">市场因子</text>
<text x="48.0" y="96.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#0C447C" text-anchor="start">1 个</text>
<text x="48.0" y="128.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start">· 暴露列全是 1</text>
<text x="48.0" y="150.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start">· 承接全市场涨跌</text>
<text x="48.0" y="172.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start">· 类似 beta = 1</text>
<text x="48.0" y="200.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#0C447C" text-anchor="start">吸收全市场层面的</text>
<text x="48.0" y="218.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#0C447C" text-anchor="start">系统性风险。</text>
<rect x="245.0" y="48.0" width="190.0" height="190.0" rx="12.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="263.0" y="74.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#633806" text-anchor="start">行业因子</text>
<text x="263.0" y="96.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#633806" text-anchor="start">32 个</text>
<text x="263.0" y="128.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">· 0/1 哑变量</text>
<text x="263.0" y="150.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">· 需做正交化纯化</text>
<text x="263.0" y="172.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">· 刻画行业内共动</text>
<text x="263.0" y="200.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#633806" text-anchor="start">吸收行业内共同变动，</text>
<text x="263.0" y="218.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#633806" text-anchor="start">降低残差截面相关性。</text>
<rect x="460.0" y="48.0" width="190.0" height="190.0" rx="12.0" fill="#F0EAFB" stroke="#6B4FA8" stroke-width="0.5"/>
<text x="478.0" y="74.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#4A3378" text-anchor="start">风格因子</text>
<text x="478.0" y="96.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#4A3378" text-anchor="start">10 个</text>
<text x="478.0" y="128.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#4A3378" text-anchor="start">· 由 descriptor 合成</text>
<text x="478.0" y="150.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#4A3378" text-anchor="start">· 跨行业的横截面风险</text>
<text x="478.0" y="172.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#4A3378" text-anchor="start">· 市值/价值/动量…</text>
<text x="478.0" y="200.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#4A3378" text-anchor="start">归因与风险约束</text>
<text x="478.0" y="218.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#4A3378" text-anchor="start">的主要对象。</text>
<rect x="30.0" y="254.0" width="620.0" height="84.0" rx="10.0" fill="#F0EAFB" stroke="#6B4FA8" stroke-width="0.5"/>
<text x="48.0" y="276.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#4A3378" text-anchor="start">合计约 43 列。其中 32 列为行业哑变量，属于控制变量：其作用是吸收行业</text>
<text x="48.0" y="296.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#4A3378" text-anchor="start">内共动、使残差近似满足截面不相关的假设，本身不构成可交易的风险溢价来源。</text>
<text x="48.0" y="316.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#4A3378" text-anchor="start">将行业因子收益视为 alpha 来源，属于常见误用。</text>
</svg>