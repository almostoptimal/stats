<svg viewBox="0 0 680 322" width="680" height="322" xmlns="http://www.w3.org/2000/svg">
<title>协方差的结构分解</title>
<desc>股票协方差分解为因子部分 X F X 转置与特异部分 Delta 的和。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="322" fill="#FFFFFF"/>
<text x="30.0" y="30.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start">收益与协方差的结构分解</text>
<rect x="40.0" y="60.0" width="96.0" height="150.0" rx="4.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="88.0" y="138.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Σ</text>
<text x="88.0" y="232.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#0C447C" text-anchor="middle">N×N</text>
<text x="88.0" y="248.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#0C447C" text-anchor="middle">想估的</text>
<text x="152.0" y="138.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="central">=</text>
<rect x="176.0" y="60.0" width="20.0" height="150.0" rx="3.0" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.8"/>
<text x="186.0" y="232.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle">X</text>
<text x="186.0" y="248.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#0C447C" text-anchor="middle">N×K</text>
<rect x="204.0" y="106.0" width="52.0" height="58.0" rx="3.0" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.8"/>
<text x="230.0" y="232.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="middle">F</text>
<text x="230.0" y="248.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#633806" text-anchor="middle">K×K</text>
<rect x="264.0" y="60.0" width="108.0" height="20.0" rx="3.0" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.8"/>
<text x="318.0" y="232.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle">Xᵀ</text>
<text x="318.0" y="248.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#0C447C" text-anchor="middle">K×N</text>
<text x="390.0" y="138.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="central">+</text>
<rect x="410.0" y="60.0" width="96.0" height="150.0" rx="3.0" fill="#FFFFFF" stroke="#3F7D44" stroke-width="0.8"/>
<path d="M410.0 210.0 L506.0 60.0" fill="none" stroke="#B7DFB9" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M410.0 60.0 L506.0 210.0" fill="none" stroke="#B7DFB9" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="458.0" y="232.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2F5B2B" text-anchor="middle">Δ</text>
<text x="458.0" y="248.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2F5B2B" text-anchor="middle">只有对角线</text>
<text x="534.0" y="106.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#633806" text-anchor="start">因子风险</text>
<text x="534.0" y="126.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#633806" text-anchor="start">K 个共同因子</text>
<text x="534.0" y="146.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#633806" text-anchor="start">引致的协方差部分</text>
<text x="534.0" y="176.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#2F5B2B" text-anchor="start">特异性风险</text>
<text x="534.0" y="196.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2F5B2B" text-anchor="start">个股残差方差</text>
<text x="534.0" y="216.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2F5B2B" text-anchor="start">仅保留对角线</text>
<rect x="30.0" y="268.0" width="620.0" height="40.0" rx="10.0" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="48.0" y="290.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">K=42（名义 43 列，正交化后丢一列）、N≈3000：左侧 K 阶矩阵可由 T≫K 估计，右侧仅需 N 个方差。</text>
</svg>