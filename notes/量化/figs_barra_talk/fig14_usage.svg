<svg viewBox="0 0 680 360" width="680" height="360" xmlns="http://www.w3.org/2000/svg">
<title>拿到协方差矩阵之后能做什么</title>
<desc>事前风险预测、组合优化约束、绩效归因、因子中性化四类用法，以及三件做不到的事。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>
<text x="30.0" y="30.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start">协方差矩阵 Σ 的四类用途及模型的能力边界</text>
<rect x="30.0" y="48.0" width="290.0" height="108.0" rx="12.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="48.0" y="76.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#0C447C" text-anchor="start">① 事前风险预测</text>
<text x="48.0" y="98.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#0C447C" text-anchor="start">σ(p) = √(wᵀΣw)</text>
<text x="48.0" y="118.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start">给出组合的事前波动，</text>
<text x="48.0" y="136.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start">用于确定仓位规模</text>
<text x="48.0" y="154.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start">与风险预算分配</text>
<rect x="360.0" y="48.0" width="290.0" height="108.0" rx="12.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="378.0" y="76.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#633806" text-anchor="start">② 组合优化的风险项</text>
<text x="378.0" y="98.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#633806" text-anchor="start">min wᵀΣw − λ·αᵀw</text>
<text x="378.0" y="118.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">为均值-方差优化提供</text>
<text x="378.0" y="136.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">风险项，并对行业、</text>
<text x="378.0" y="154.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">风格暴露施加约束</text>
<rect x="30.0" y="168.0" width="290.0" height="108.0" rx="12.0" fill="#E7F5E9" stroke="#3F7D44" stroke-width="0.5"/>
<text x="48.0" y="196.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#2F5B2B" text-anchor="start">③ 绩效归因</text>
<text x="48.0" y="218.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#2F5B2B" text-anchor="start">r(p) = Σ X(p,k)·f(k) + u(p)</text>
<text x="48.0" y="238.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2F5B2B" text-anchor="start">将已实现收益分解至</text>
<text x="48.0" y="256.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2F5B2B" text-anchor="start">行业、风格与特异性</text>
<text x="48.0" y="274.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2F5B2B" text-anchor="start">三个层面</text>
<rect x="360.0" y="168.0" width="290.0" height="108.0" rx="12.0" fill="#F0EAFB" stroke="#6B4FA8" stroke-width="0.5"/>
<text x="378.0" y="196.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#4A3378" text-anchor="start">④ 因子中性化</text>
<text x="378.0" y="218.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#4A3378" text-anchor="start">约束 X(p,k) ≈ 0</text>
<text x="378.0" y="238.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#4A3378" text-anchor="start">约束组合在特定因子</text>
<text x="378.0" y="256.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#4A3378" text-anchor="start">上的暴露，剥离该因子</text>
<text x="378.0" y="274.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#4A3378" text-anchor="start">风险，保留选股收益</text>
<rect x="30.0" y="288.0" width="620.0" height="56.0" rx="10.0" fill="#FCE8E6" stroke="#A32D2D" stroke-width="0.5"/>
<text x="48.0" y="310.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#8B1F1F" text-anchor="start">它做不到：① 告诉你哪个因子能赚钱（f_t 没有溢价保证）</text>
<text x="48.0" y="330.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#8B1F1F" text-anchor="start">② 拿 f_t 做因子择时　③ 预测一年期的波动（半衰期只有 40–250 天，是短周期工具）</text>
</svg>