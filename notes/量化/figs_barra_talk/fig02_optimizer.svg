<text x="48.0" y="336.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">因此需引入 Eigenfactor 特征根调整与 VRA 波动区制调整，以控制该方向上的偏差。</text>
