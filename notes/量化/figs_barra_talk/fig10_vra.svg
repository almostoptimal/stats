<text x="120.0" y="76.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">低波动区制</text>
<text x="120.0" y="94.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">预测与实现接近</text>
<text x="84.0" y="50.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="start">—— 实际波动</text>
<text x="196.0" y="50.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="start">‐ ‐ 模型预测波动（滞后）</text>
<rect x="30.0" y="254.0" width="620.0" height="82.0" rx="10.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="48.0" y="278.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#633806" text-anchor="start">偏差统计量 B = 平均 [（实际收益 ÷ 预测波动）²]，理想值 = 1。</text>
<text x="48.0" y="300.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">B &gt; 1 说明模型近期系统性低估 → 协方差 F 与特异方差 Δ 一起乘 B 修正。</text>
<text x="48.0" y="322.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">量纲说明：B 为方差口径的比值，故须乘 B 本身；乘 √B 仅相当于修正 B 的四分之一次方。</text>
</svg>