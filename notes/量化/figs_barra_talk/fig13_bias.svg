<text x="48.0" y="338.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">总体 B≈1.0 会掩盖上述结构性偏差，因此须分层检验。</text>
