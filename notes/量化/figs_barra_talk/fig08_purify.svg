<svg viewBox="0 0 680 330" width="680" height="330" xmlns="http://www.w3.org/2000/svg">
<title>行业哑变量的纯化</title>
<desc>行业哑变量减去市值占比后列和为零，与市场因子正交，需再丢弃一列以保证矩阵可逆。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="330" fill="#FFFFFF"/>
<text x="30.0" y="30.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start">行业哑变量的正交化与降秩处理</text>
<rect x="30.0" y="52.0" width="186.0" height="168.0" rx="12.0" fill="#FCE8E6" stroke="#A32D2D" stroke-width="0.5"/>
<text x="46.0" y="76.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#8B1F1F" text-anchor="start">① 原始状态</text>
<rect x="50.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#FFFFFF" stroke="#A32D2D" stroke-width="0.8"/>
<rect x="78.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#F3C9C4" stroke="#A32D2D" stroke-width="0.8"/>
<rect x="102.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#F3C9C4" stroke="#A32D2D" stroke-width="0.8"/>
<rect x="126.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#F3C9C4" stroke="#A32D2D" stroke-width="0.8"/>
<rect x="150.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#F3C9C4" stroke="#A32D2D" stroke-width="0.8"/>
<text x="46.0" y="200.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#8B1F1F" text-anchor="start">32 个行业列相加 = 全 1 列</text>
<text x="46.0" y="216.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#8B1F1F" text-anchor="start">= 市场因子那一列</text>
<path d="M226.0 136.0 L244.0 136.0" fill="none" stroke="#854F0B" stroke-width="1.6" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="250.0" y="52.0" width="186.0" height="168.0" rx="12.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="266.0" y="76.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#633806" text-anchor="start">② 每列减去 s(j)</text>
<rect x="270.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.8"/>
<rect x="298.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/>
<rect x="322.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.8"/>
<rect x="346.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/>
<rect x="370.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.8"/>
<text x="266.0" y="200.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#633806" text-anchor="start">列和 = 0，与全 1 列正交</text>
<text x="266.0" y="216.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#633806" text-anchor="start">行业收益 = 相对大盘的强弱</text>
<path d="M446.0 136.0 L464.0 136.0" fill="none" stroke="#3F7D44" stroke-width="1.6" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="470.0" y="52.0" width="180.0" height="168.0" rx="12.0" fill="#E7F5E9" stroke="#3F7D44" stroke-width="0.5"/>
<text x="486.0" y="76.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#2F5B2B" text-anchor="start">③ 再丢掉一列</text>
<rect x="490.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#FFFFFF" stroke="#3F7D44" stroke-width="0.8"/>
<rect x="518.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#B7DFB9" stroke="#3F7D44" stroke-width="0.8"/>
<rect x="542.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#B7DFB9" stroke="#3F7D44" stroke-width="0.8"/>
<rect x="566.0" y="92.0" width="22.0" height="96.0" rx="2.0" fill="#B7DFB9" stroke="#3F7D44" stroke-width="0.8"/>
<text x="486.0" y="200.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2F5B2B" text-anchor="start">31 列，秩正好，可逆</text>
<text x="486.0" y="216.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2F5B2B" text-anchor="start">行业与市场的拆分才唯一</text>
<rect x="30.0" y="236.0" width="620.0" height="76.0" rx="10.0" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="48.0" y="258.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">s(j) = 行业 j 的 √市值占比；须用回归权重计算，使用普通市值占比则不正交。</text>
<text x="48.0" y="278.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">纯化后行业块仅剩 31 个自由度；保留 32 列将使 XᵀWX 奇异，数值求解返回最小范数解而非真实解。</text>
<text x="48.0" y="298.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">该变换等价于设定识别约束：行业因子收益按加权求和恒为零，仅刻画相对全市场的超额部分。</text>
</svg>