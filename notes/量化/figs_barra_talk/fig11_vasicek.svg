<svg viewBox="0 0 680 330" width="680" height="330" xmlns="http://www.w3.org/2000/svg">
<title>Vasicek 贝叶斯收缩</title>
<desc>样本特异方差向市值分位与行业分组的组内均值收缩，历史短的样本收缩更多。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="330" fill="#FFFFFF"/>
<text x="30.0" y="30.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start">Vasicek 收缩：样本特异方差向组内均值收缩</text>
<path d="M90.0 168.0 L610.0 168.0" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M380.0 120.0 L380.0 216.0" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="380.0" y="108.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#2F5B2B" text-anchor="middle">组内均值 σ̄²（市值分位 × 行业）</text>
<circle cx="118.0" cy="168.0" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.0"/>
<circle cx="144.2" cy="168.0" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.0"/>
<path d="M118.0 154.0 L144.2 154.0" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="118.0" y="142.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2563EB" text-anchor="middle">样本期短</text>
<text x="118.0" y="194.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2563EB" text-anchor="middle">收缩幅度大</text>
<circle cx="172.0" cy="168.0" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.0"/>
<circle cx="192.8" cy="168.0" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.0"/>
<path d="M172.0 154.0 L192.8 154.0" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="172.0" y="142.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2563EB" text-anchor="middle">样本期短</text>
<text x="172.0" y="194.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2563EB" text-anchor="middle">收缩幅度大</text>
<circle cx="214.0" cy="168.0" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.0"/>
<circle cx="230.6" cy="168.0" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.0"/>
<path d="M214.0 154.0 L230.6 154.0" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="268.0" cy="168.0" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.0"/>
<circle cx="279.2" cy="168.0" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.0"/>
<path d="M268.0 154.0 L279.2 154.0" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="318.0" cy="168.0" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.0"/>
<circle cx="324.2" cy="168.0" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.0"/>
<path d="M318.0 154.0 L324.2 154.0" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="442.0" cy="168.0" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.0"/>
<circle cx="435.8" cy="168.0" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.0"/>
<path d="M442.0 154.0 L435.8 154.0" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="486.0" cy="168.0" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.0"/>
<circle cx="475.4" cy="168.0" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.0"/>
<path d="M486.0 154.0 L475.4 154.0" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="556.0" cy="168.0" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.0"/>
<circle cx="538.4" cy="168.0" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.0"/>
<path d="M556.0 154.0 L538.4 154.0" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="592.0" cy="168.0" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.0"/>
<circle cx="570.8" cy="168.0" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.0"/>
<path d="M592.0 154.0 L570.8 154.0" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="510.0" y="198.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2F5B2B" text-anchor="middle">样本期长：收缩幅度小</text>
<rect x="30.0" y="246.0" width="620.0" height="66.0" rx="10.0" fill="#E7F5E9" stroke="#3F7D44" stroke-width="0.5"/>
<text x="48.0" y="270.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#2F5B2B" text-anchor="start">σ̂² = (1 − ν) · σ̂²(样本) + ν · σ̄²(组)，  ν = 0.10（官方值）</text>
<text x="48.0" y="292.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2F5B2B" text-anchor="start">样本期越短，样本方差的抽样误差越大，收缩权重 1−ν 相应降低，避免新股获得极端方差估计。</text>
</svg>