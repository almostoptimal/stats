<svg viewBox="0 0 680 340" width="680" height="340" xmlns="http://www.w3.org/2000/svg">
<title>为什么用根号市值加权</title>
<desc>小市值股票残差波动大、大市值小，因此回归权重取市值平方根以与噪声大小反向匹配。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="340" fill="#FFFFFF"/>
<text x="30.0" y="30.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start">√市值加权的依据：权重与残差异方差的匹配</text>
<path d="M86.0 258.0 L610.0 258.0" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
