<path d="M86.0 230.6 L144.2 220.8 L202.4 209.0 L260.7 197.2 L318.9 183.5 L377.1 169.8 L435.3 152.2 L493.6 132.6 L551.8 105.1 L610.0 62.0" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="86.0" cy="71.8" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="86.0" cy="230.6" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="144.2" cy="89.4" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="144.2" cy="220.8" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="202.4" cy="109.0" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="202.4" cy="209.0" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="260.7" cy="128.6" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="260.7" cy="197.2" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="318.9" cy="146.3" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="318.9" cy="183.5" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="377.1" cy="162.0" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="377.1" cy="169.8" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="435.3" cy="177.6" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="435.3" cy="152.2" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="493.6" cy="191.4" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="493.6" cy="132.6" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="551.8" cy="203.1" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="551.8" cy="105.1" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="610.0" cy="212.9" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8"/>
<circle cx="610.0" cy="62.0" r="3.4" fill="#D97706" stroke="#FFFFFF" stroke-width="0.8"/>
<path d="M86.0 160.0 L610.0 160.0" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="606.0" y="152.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">等权 OLS：忽略残差异方差，估计效率损失</text>
<text x="179.2" y="75.7" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">残差标准差</text>
<text x="179.2" y="91.4" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#2563EB" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">小市值高、大市值低</text>
<text x="371.3" y="191.4" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">回归权重 ∝ √市值</text>
<text x="371.3" y="207.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#D97706" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">小市值低、大市值高</text>
<text x="348.0" y="298.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">市值分位（左 = 小市值，右 = 大市值）</text>
<rect x="30.0" y="286.0" width="620.0" height="40.0" rx="10.0" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="48.0" y="308.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">权重曲线与残差标准差曲线反向，使加权后各样本残差方差趋于一致，满足 WLS 的最优权重条件。</text>
</svg>