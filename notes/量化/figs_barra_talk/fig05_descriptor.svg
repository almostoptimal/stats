<svg viewBox="0 0 680 324" width="680" height="324" xmlns="http://www.w3.org/2000/svg">
<title>descriptor 合成风格因子</title>
<desc>三个标准化后的 descriptor 按固定权重合成为一个风格因子，以 Earnings Yield 为例。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="324" fill="#FFFFFF"/>
<text x="30.0" y="30.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start">风格因子由 descriptor 按固定权重合成</text>
<rect x="40.0" y="58.0" width="200.0" height="44.0" rx="8.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56.0" y="74.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start">EPFWD  远期盈利 / 价格</text>
<text x="56.0" y="92.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#0C447C" text-anchor="start">分析师一致预期（权重最大）</text>
<rect x="40.0" y="116.0" width="200.0" height="44.0" rx="8.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56.0" y="132.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start">CETOP  现金流 / 市值</text>
<text x="56.0" y="150.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#0C447C" text-anchor="start">经营现金流 TTM</text>
<rect x="40.0" y="174.0" width="200.0" height="44.0" rx="8.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56.0" y="190.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start">ETOP  净利润 / 市值</text>
<text x="56.0" y="208.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#0C447C" text-anchor="start">净利润 TTM</text>
<path d="M246.0 80.0 L336.0 128.0" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="292.0" y="78.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#633806" text-anchor="start">0.68</text>
<path d="M246.0 138.0 L336.0 140.0" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="292.0" y="130.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#633806" text-anchor="start">0.21</text>
<path d="M246.0 196.0 L336.0 152.0" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="292.0" y="202.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#633806" text-anchor="start">0.11</text>
<rect x="342.0" y="108.0" width="268.0" height="66.0" rx="10.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="476.0" y="132.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#633806" text-anchor="middle">Earnings Yield（盈利收益率）</text>
<text x="476.0" y="154.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="11" font-weight="400" fill="#633806" text-anchor="middle">合成之后再标准化一次</text>
<rect x="30.0" y="240.0" width="620.0" height="68.0" rx="10.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="48.0" y="262.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">这些权重是官方固定给定的，不是回归估出来的 —— 全市场所有股票、所有日期，用的都是同一套权重。</text>
<text x="48.0" y="282.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start">合成顺序也有讲究：先各自去极值、标准化，再加权相加，最后再标准化一次。</text>
</svg>